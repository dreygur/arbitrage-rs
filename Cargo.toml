[package]
name = "arbitrage"
version = "0.1.0"
edition = "2024"
default-run = "arbitrage"

[dependencies]
alloy = { version = "2", features = ["full", "json", "signer-mnemonic"] }
uniswap-v4-sdk = { version = "2", features = ["std"] }
uniswap-v3-sdk = { version = "7", features = ["std"] }
ruint = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util"] }
futures = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dotenvy = "0.15"
eyre = "0.6"
rayon = "1"

[dev-dependencies]
criterion = "0.8"
tokio = { version = "1", features = ["test-util"] }

[features]
testkit = []

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[profile.release-max]
inherits = "release"
lto = "fat"
codegen-units = 1

[[bench]]
name = "step"
harness = false
required-features = ["testkit"]
